[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verif-whatsapp"
version = "0.1.0"
description = "Robot de fact-checking WhatsApp pour l'Afrique de l'Ouest"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.9.0",
    "pytesseract>=0.3.13",
    "pillow>=10.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

# Sans cette section, setuptools refuse l'installation : le dépôt contient
# plusieurs dossiers de premier niveau (app, data, scripts, tests).
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
strict = true

# `ignore_missing_imports` global masquait les modules du projet introuvables (la CI restait
# verte alors que le webhook importait un fichier inexistant). On ne le tolère que pour les
# bibliothèques sans annotations de types.
[[tool.mypy.overrides]]
module = ["pytesseract.*"]
ignore_missing_imports = true
